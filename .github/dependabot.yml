version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # メジャーアップは破壊的変更リスクが高いため個別で判断する
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # openapi-typescript の peer が typescript@^5.x のため TS7 は npm ci が通らない
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 はプラグイン（jsx-a11y / react-hooks / typescript-eslint）の対応を確認してから上げる
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
