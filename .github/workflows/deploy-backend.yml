name: Deploy Backend to Cloud Run

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    env:
      IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/yield-guard/backend
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build and push Docker image
        run: |
          # mode=max: builder ステージ（Go コンパイル結果）を含む全レイヤーを保存。
          # min だと最終 alpine ステージのみでコンパイルが毎回走る。
          docker buildx build \
            --cache-from "type=registry,ref=${{ env.IMAGE }}:buildcache" \
            --cache-to   "type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max" \
            --tag "${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}" \
            --tag "${{ env.IMAGE }}:latest" \
            --push \
            ./backend

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d  # v3.0.1
        with:
          # このワークフローは main ブランチ → prod 環境専用。
          # stg 環境用には deploy-backend-stg.yml を別途作成し service 名を変更する。
          service: yield-guard-prod-backend
          region: asia-northeast1
          image: ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
