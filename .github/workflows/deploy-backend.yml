name: Deploy Backend to Cloud Run

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: write

    env:
      IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/yield-guard/backend
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build Docker image
        run: |
          # mode=max: builder ステージ（Go コンパイル結果）を含む全レイヤーを保存。
          # min だと最終 alpine ステージのみでコンパイルが毎回走る。
          # --load: Trivy スキャンのためローカル Docker daemon にイメージを展開する。
          # type=gha: GitHub Actions キャッシュを使用することで Artifact Registry への
          # egress 転送（GCP→Azure）が発生しなくなりコストを削減できる。
          docker buildx build \
            --cache-from "type=gha,scope=${{ github.workflow }}" \
            --cache-to   "type=gha,scope=${{ github.workflow }},mode=max" \
            --tag "${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}" \
            --load \
            ./backend

      - name: Cache Trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      # AR Standard scanning was deprecated on 2025-07-31 (issue #457).
      # Vulnerability scanning relies solely on Trivy; AR Advanced scanning is intentionally omitted.
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
          scanners: vuln
          cache-dir: ~/.cache/trivy

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Push Docker image
        run: |
          docker tag "${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}" "${{ env.IMAGE }}:latest"
          docker push "${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}"
          docker push "${{ env.IMAGE }}:latest"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d  # v3.0.1
        with:
          # このワークフローは main ブランチ → prod 環境専用。
          # stg 環境用には deploy-backend-stg.yml を別途作成し service 名を変更する。
          service: yield-guard-prod-backend
          region: asia-northeast1
          image: ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
