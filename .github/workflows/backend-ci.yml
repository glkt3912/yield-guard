name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  schedule:
    - cron: "0 1 * * 1"  # 毎週月曜 01:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Cache swag binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go/bin/swag
          key: swag-v1.16.6

      - name: Install swag
        run: which swag || go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Check schema drift (swagger.json)
        working-directory: .
        run: |
          make swagger
          git diff --exit-code docs/openapi/swagger.json

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          working-directory: backend
          version: v2.11.4
          cache-invalidation-interval: 1

      - name: go test
        run: |
          go test -race -coverprofile=coverage.out ./... -timeout 120s
          go tool cover -func=coverage.out | tee coverage.txt
          echo "## Go Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep total coverage.txt | awk '{gsub(/%/,"",$3); if ($3+0 < 80) { print "Coverage " $3 "% is below 80% threshold"; exit 1 }}'

      - name: Cache govulncheck binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-v1.1.4

      - name: Install govulncheck
        run: which govulncheck || go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: govulncheck
        run: govulncheck ./...

      - name: go build
        run: go build ./cmd/server

      - name: docker build (smoke test)
        working-directory: .
        run: docker build --progress=plain ./backend

  integration-test:
    name: Integration Test (MLIT API)
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run integration tests
        env:
          MLIT_API_KEY: ${{ secrets.MLIT_API_KEY }}
        run: go test -tags=integration -v ./internal/mlit/... -timeout 120s
