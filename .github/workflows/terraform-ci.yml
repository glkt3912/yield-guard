name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply changes? (false = plan only)"
        type: boolean
        default: false
        required: true
      environment:
        description: "Target environment"
        type: choice
        options: [prod, stg]
        default: prod
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: ${{ github.event_name == 'workflow_dispatch' && (inputs.apply && 'Plan & Apply' || 'Plan only') || 'Format, Validate, Lint & Plan' }}
    runs-on: ubuntu-24.04

    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_env: ${{ inputs.environment || 'prod' }}
      TF_VAR_region: "asia-northeast1"
      TF_VAR_mlit_api_key: ${{ secrets.MLIT_API_KEY }}
      TF_VAR_app_internal_api_key: ${{ inputs.environment == 'stg' && secrets.APP_INTERNAL_API_KEY_STG || secrets.APP_INTERNAL_API_KEY }}
      TF_VAR_vercel_frontend_url: ${{ inputs.environment == 'stg' && vars.VERCEL_FRONTEND_URL_STG || vars.VERCEL_FRONTEND_URL }}
      TF_VAR_notification_email: ${{ vars.NOTIFICATION_EMAIL }}
      TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.14.9"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.environment == 'stg' && secrets.WIF_PROVIDER_STG || secrets.WIF_PROVIDER }}
          service_account: ${{ inputs.environment == 'stg' && secrets.SA_EMAIL_STG || secrets.SA_EMAIL }}

      - name: Terraform Init
        run: |
          if [ "${{ inputs.environment }}" = "stg" ]; then
            terraform init -backend-config=backend-stg.hcl -reconfigure
          else
            terraform init
          fi
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a  # v6.3.0

      - name: tflint Init
        run: tflint --init
        working-directory: terraform

      - name: tflint
        run: tflint --format compact
        working-directory: terraform

      - name: Terraform Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -out=tfplan -no-color 2>&1 | tee /tmp/plan.txt
        working-directory: terraform

      - name: Post Plan to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;
            const status = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';
            const summaryMatch = plan.match(/^(Plan: .+|No changes\..+)$/m);
            const summary = summaryMatch ? summaryMatch[0] : '';
            const body = [
              `## ${status} Terraform Plan`,
              summary,
              `<details><summary>詳細を表示</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n</details>`,
            ].filter(Boolean).join('\n');

            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.data.find(c =>
              c.user.login === 'github-actions[bot]' &&
              (c.body.includes('## ✅ Terraform Plan') || c.body.includes('## ❌ Terraform Plan'))
            );
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        run: terraform apply -auto-approve tfplan
        working-directory: terraform
