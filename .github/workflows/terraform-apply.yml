name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply changes? (false = plan only)"
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: ${{ inputs.apply && 'Plan & Apply' || 'Plan only' }}
    runs-on: ubuntu-24.04

    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_env: "prod"
      TF_VAR_region: "asia-northeast1"
      TF_VAR_mlit_api_key: ${{ secrets.TF_VAR_MLIT_API_KEY }}
      TF_VAR_app_internal_api_key: ${{ secrets.TF_VAR_APP_INTERNAL_API_KEY }}
      TF_VAR_vercel_frontend_url: ${{ vars.VERCEL_FRONTEND_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85  # v4.0.0
        with:
          terraform_version: "1.14.9"

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f  # v2.1.7
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan -out=tfplan -no-color
        working-directory: terraform

      - name: Terraform Apply
        if: inputs.apply
        run: terraform apply -auto-approve tfplan
        working-directory: terraform
