name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/openapi/**"
      - ".github/workflows/frontend-ci.yml"
      - "Makefile"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "frontend/**"
      - "docs/openapi/**"
      - ".github/workflows/frontend-ci.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Format, Lint, Type Check & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event.action != 'closed'

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ランタイム依存 (dependencies) の high 以上の既知脆弱性でゲートする (#801)
      # devDependencies はビルド時のみ使用のため対象外。
      # 修正版未リリースの advisory でブロックされた場合は package.json の
      # overrides で一時回避するか、修正版リリースまで本ステップを一時 skip する
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Generate TypeScript types
        run: npm run generate:types

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test -- --coverage

      - name: Coverage Summary
        if: always()
        run: |
          echo "## Frontend Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage/coverage-summary.json | node -e "
            const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).total;
            ['lines','statements','functions','branches'].forEach(k=>
              process.stdout.write(k+': '+d[k].pct+'%\n')
            );
          " >> $GITHUB_STEP_SUMMARY || echo 'Coverage data unavailable' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests (Playwright / Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: ci

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        if: github.event_name == 'pull_request'
        run: npm run e2e:ci -- --grep "@p1|@p2"
        env:
          CI: "true"

      - name: E2E full suite
        if: github.ref == 'refs/heads/main'
        run: npm run e2e:ci
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [ci, e2e]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: frontend

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Firebase の Web 設定は公開値なので Repository variables で管理（ビルド時に埋め込まれる）
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      NO_COLOR: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate API types
        run: npm run generate:types

      - name: Build
        run: npm run build

      - name: Deploy (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy --var "BACKEND_URL:${{ vars.BACKEND_URL_PROD }}"

      # PR ごとに stg Worker (yield-guard-stg) へ未公開バージョンを上げ、エイリアス付きプレビュー URL を得る。
      # バージョンは Cloudflare 側で保持されるだけなので PR クローズ時の削除は不要
      - name: Deploy (preview)
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          OUTPUT=$(npx wrangler versions upload --env stg \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --var "BACKEND_URL:${{ vars.BACKEND_URL_STG }}" 2>&1) || { echo "$OUTPUT"; exit 1; }
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oE 'https://pr-[a-zA-Z0-9._-]+\.workers\.dev' | tail -1)
          if [ -z "$URL" ]; then
            echo "::error::Preview alias URL not found in wrangler output"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const marker = '<!-- cf-preview -->';
            const url = process.env.PREVIEW_URL;
            const body = `${marker}\n## Cloudflare プレビュー\n\n${url}\n\n> このプレビューはステージング API (\`BACKEND_URL_STG\`) を使用しています。API 変更を含む PR は stg バックエンドの再デプロイ (deploy-backend-stg.yml) が必要です。`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
