name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/openapi/**"
      - ".github/workflows/frontend-ci.yml"
      - "Makefile"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "frontend/**"
      - "docs/openapi/**"
      - ".github/workflows/frontend-ci.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Format, Lint, Type Check & Build
    runs-on: ubuntu-24.04
    if: github.event.action != 'closed'

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          lfs: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ランタイム依存 (dependencies) の high 以上の既知脆弱性でゲートする (#801)
      # devDependencies はビルド時のみ使用のため対象外。
      # 修正版未リリースの advisory でブロックされた場合は package.json の
      # overrides で一時回避するか、修正版リリースまで本ステップを一時 skip する
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Generate TypeScript types
        run: npm run generate:types

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --coverage

      - name: Coverage Summary
        if: always()
        run: |
          echo "## Frontend Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage/coverage-summary.json | node -e "
            const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).total;
            ['lines','statements','functions','branches'].forEach(k=>
              process.stdout.write(k+': '+d[k].pct+'%\n')
            );
          " >> $GITHUB_STEP_SUMMARY || echo 'Coverage data unavailable' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests (Playwright / Chromium)
    runs-on: ubuntu-24.04
    needs: ci

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          lfs: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          BACKEND_URL: "http://127.0.0.1:1"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        if: github.event_name == 'pull_request'
        run: npm run e2e:ci -- --grep "@p1|@p2"
        env:
          CI: "true"

      - name: E2E full suite
        if: github.ref == 'refs/heads/main'
        run: npm run e2e:ci
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-24.04
    needs: [ci, e2e]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          lfs: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@51.8.0

      # Vercel には frontend/ のみアップロードされ swagger.json が存在しないため、
      # api.generated.ts を runner 側で生成してデプロイに含める（investment.ts が import する）
      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Generate API types
        run: npm run generate:types
        working-directory: frontend

      - name: Deploy to Vercel (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel deploy --prod --yes
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NO_COLOR: "1"

      - name: Deploy to Vercel (preview)
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          # || true prevents set -e from exiting before we can inspect the output
          OUTPUT=$(vercel deploy --yes 2>&1) || true
          echo "$OUTPUT"
          # Vercel CLI v51 outputs "✅  Preview: https://xxx.vercel.app [3s]"
          # tail -1 picks the Preview URL; the Inspect URL (vercel.com) is excluded by the pattern
          URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' | tail -1)
          if [ -z "$URL" ]; then
            echo "::error::Vercel deploy failed or preview URL not found in output"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NO_COLOR: "1"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const url = process.env.PREVIEW_URL;
            const body = `${marker}\n## Vercel プレビュー\n\n${url}\n\n> このプレビューはステージング API (\`BACKEND_URL\` の Preview 環境変数) を使用しています。API 変更を含む PR は stg バックエンドの再デプロイ (deploy-backend-stg.yml) が必要です。`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}

