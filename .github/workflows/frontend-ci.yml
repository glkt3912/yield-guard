name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/openapi/**"
      - ".github/workflows/frontend-ci.yml"
      - "Makefile"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - "frontend/**"
      - "docs/openapi/**"
      - ".github/workflows/frontend-ci.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Format, Lint, Type Check & Build
    runs-on: ubuntu-24.04
    if: github.event.action != 'closed'

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate TypeScript types
        run: npm run generate:types

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --coverage

      - name: Coverage Summary
        if: always()
        run: |
          echo "## Frontend Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage/coverage-summary.json | node -e "
            const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).total;
            ['lines','statements','functions','branches'].forEach(k=>
              process.stdout.write(k+': '+d[k].pct+'%\n')
            );
          " >> $GITHUB_STEP_SUMMARY || echo 'Coverage data unavailable' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests (Playwright / Chromium)
    runs-on: ubuntu-24.04
    needs: ci

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          BACKEND_URL: "http://127.0.0.1:1"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        if: github.event_name == 'pull_request'
        run: npm run e2e:ci -- --grep "@p1|@p2"
        env:
          CI: "true"

      - name: E2E full suite
        if: github.ref == 'refs/heads/main'
        run: npm run e2e:ci
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-24.04
    needs: [ci, e2e]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22.22.2"

      - name: Install Vercel CLI
        run: npm install -g vercel@51.8.0

      - name: Deploy to Vercel (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel deploy --prod --yes
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NO_COLOR: "1"

      - name: Deploy to Vercel (preview)
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          # || true prevents set -e from exiting before we can inspect the output
          OUTPUT=$(vercel deploy --yes 2>&1) || true
          echo "$OUTPUT"
          # Vercel CLI v51 outputs "✅  Preview: https://xxx.vercel.app [3s]"
          # tail -1 picks the Preview URL; the Inspect URL (vercel.com) is excluded by the pattern
          URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' | tail -1)
          if [ -z "$URL" ]; then
            echo "::error::Vercel deploy failed or preview URL not found in output"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NO_COLOR: "1"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const url = process.env.PREVIEW_URL;
            const body = `${marker}\n## Vercel プレビュー\n\n${url}\n\n> ⚠️ このプレビューは本番 API (\`NEXT_PUBLIC_API_URL\`) を使用しています。`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}

  cleanup:
    name: Delete Vercel preview on PR close
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Get preview URL from PR comment
        id: get-url
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const comment = comments.find(c => c.body.includes(marker));
            if (!comment) { core.setOutput('url', ''); return; }
            const match = comment.body.match(/https:\/\/[a-zA-Z0-9._-]+\.vercel\.app/);
            core.setOutput('url', match ? match[0] : '');

      - name: Install Vercel CLI
        if: steps.get-url.outputs.url != ''
        run: npm install -g vercel@51.8.0

      - name: Delete preview deployment
        if: steps.get-url.outputs.url != ''
        continue-on-error: true
        run: vercel rm "${{ steps.get-url.outputs.url }}" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NO_COLOR: "1"
