pre-commit:
  parallel: true
  commands:
    # シークレットの誤コミット防止 (#800)。未インストール時は警告のみで通す
    # （CI の secret-scan.yml が最終ゲート）。導入: make install-hooks
    gitleaks:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact
        else
          echo "WARN: gitleaks が未インストールのためシークレットスキャンをスキップしました (make install-hooks で導入)"
        fi
    go-lint:
      glob: "backend/**/*.go"
      run: cd backend && golangci-lint run ./...
    # Go 型・swag アノテーション変更時に swagger.json を再生成して同一コミットに含める (#840)
    # 未インストール時は警告のみで通す（CI backend-ci.yml の drift チェックが最終ゲート）
    # 導入: go install github.com/swaggo/swag/cmd/swag@v1.16.6
    swagger:
      glob: "backend/**/*.go"
      run: |
        set -e
        # 非テストの backend Go が staged のときだけ再生成（テストのみの変更はスキップ）
        if ! git diff --cached --name-only | grep -E '^backend/.*\.go$' | grep -qv '_test\.go$'; then
          exit 0
        fi
        if command -v swag >/dev/null 2>&1; then
          make swagger >/dev/null
          if ! git diff --quiet docs/openapi/swagger.json; then
            git add docs/openapi/swagger.json
            echo "==> swagger.json を再生成してステージしました (#840)"
          fi
        else
          echo "WARN: swag 未インストールのため swagger 再生成をスキップ（go install github.com/swaggo/swag/cmd/swag@v1.16.6 で導入 / CI が最終ゲート）"
        fi
    frontend-format:
      glob: "frontend/src/**/*.{ts,tsx,css}"
      run: npx --prefix frontend prettier --write {staged_files} && git add {staged_files}
    frontend-lint:
      depends: ["frontend-format"]
      glob: "frontend/src/**/*.{ts,tsx}"
      run: cd frontend && npm run lint
    frontend-typecheck:
      depends: ["frontend-format"]
      glob: "frontend/src/**/*.{ts,tsx}"
      run: cd frontend && npm run type-check

# pre-push は push 対象の diff に応じてテストを条件実行する (#795)
# - 比較基準: @{push}（upstream 未設定の新規ブランチは origin/main との merge-base）
# - 基準が解決できない場合は安全側に倒して全テストを実行する
# - lefthook.yml 自体の変更時は両方実行する
pre-push:
  commands:
    go-test:
      run: |
        base=$(git rev-parse -q --verify '@{push}' 2>/dev/null) \
          || base=$(git rev-parse -q --verify origin/main 2>/dev/null) \
          || base=""
        if [ -z "$base" ] || git diff --name-only "$base...HEAD" | grep -qE '^(backend/|lefthook\.yml$)'; then
          cd backend && go test -race ./... -timeout 120s
        else
          echo "backend: push 対象に変更がないためスキップ"
        fi
    frontend-test:
      run: |
        base=$(git rev-parse -q --verify '@{push}' 2>/dev/null) \
          || base=$(git rev-parse -q --verify origin/main 2>/dev/null) \
          || base=""
        if [ -z "$base" ] || git diff --name-only "$base...HEAD" | grep -qE '^(frontend/|docs/openapi/|lefthook\.yml$)'; then
          cd frontend && npm test
        else
          echo "frontend: push 対象に変更がないためスキップ"
        fi
